<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Alert Overlay — StreamOverlay Pro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+Thai:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="alert-container" class="alert-container">
    <div id="alert-card" class="alert-card hidden">
      <img id="alert-image" class="alert-image" src="" alt="Alert Image" style="display: none;" />
      <div class="alert-content">
        <h2 id="alert-title" class="alert-title">New Subscriber!</h2>
        <div id="alert-name" class="alert-name">User Name</div>
        <p id="alert-message" class="alert-message">ได้ติดตามช่องแล้ว!</p>
      </div>
      <div id="progress-bar" class="progress-bar"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
